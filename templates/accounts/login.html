{% extends 'base.html' %}

{% block title %}Kirish - Davomat{% endblock %}

{% block content %}
<div class="card shadow-sm p-4">
    <h3 class="text-center mb-4">Tizimga kirish</h3>

    {% if form.errors %}
        <div class="alert alert-danger">
            Login yoki parol noto'g'ri kiritildi.
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_username" class="form-label">Login</label>
            <input type="text" name="username" id="id_username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label for="id_password" class="form-label">Parol</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-3">Kirish</button>
    </form>

    <div class="text-center">
        <span>Akkauntingiz yo'qmi?</span> <a href="{% url 'register' %}">Ro'yxatdan o'tish</a>
    </div>
</div>
{% endblock %}
