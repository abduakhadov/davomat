version: '3.8'

services:
  db:
    image: postgres:16
    container_name: davomat_postgres
    environment:
      POSTGRES_DB: davomat
      POSTGRES_USER: davomat
      POSTGRES_PASSWORD: davomat
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: